<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Капитанам — Акватория</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="pages.css">
    <link rel="stylesheet" href="responsive.css">

</head>

<body>

<header class="header inner-header">

    <a href="index.html" class="logo">
        АКВАТОРИЯ
    </a>

    <nav class="nav">
        <a href="boats.html">Катера</a>
        <a href="activities.html">Активный отдых</a>
        <a href="gallery.html">Галерея</a>
        <a href="reviews.html">Отзывы</a>
        <a href="about.html">О компании</a>
        <a href="contacts.html">Контакты</a>
    </nav>

</header>


<section class="full-image-hero">

    <img src="images/area/captain.jpg"
         alt="Капитан">

    <div class="dark-overlay"></div>

    <div class="full-image-content">

        <p class="eyebrow">
            ДЛЯ КАПИТАНОВ
        </p>

        <h1>
            Ваш катер<br>
            может быть<br>
            <span>частью «Акватории»</span>
        </h1>

    </div>

</section>


<section class="section captain-page">

    <div>

        <p class="eyebrow dark">
            ПАРТНЁРСТВО
        </p>

        <h2>
            Приглашаем<br>
            владельцев<br>
            <span>катеров</span>
        </h2>

        <p>
            Размещайте информацию о своём
            судне и получайте новых клиентов.
        </p>

    </div>


    <form class="captain-form">

        <input
                type="text"
                placeholder="Ваше имя"
                required>

        <input
                type="tel"
                placeholder="Телефон"
                required>

        <input
                type="text"
                placeholder="Название катера"
                required>

        <input
                type="text"
                placeholder="Вместимость">

        <textarea
                placeholder="Расскажите о вашем катере"></textarea>

        <button
                type="submit"
                class="btn btn-dark">

            Отправить заявку

        </button>

    </form>

</section>


</body>
</html>
