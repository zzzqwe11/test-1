<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Вход — Акватория</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="pages.css">

</head>

<body>

<div class="auth-page">

    <div class="auth-box">

        <a href="index.html"
           class="logo auth-logo">

            АКВАТОРИЯ

        </a>

        <h1>
            Вход
        </h1>

        <p>
            Войдите в личный кабинет
        </p>


        <form id="login-form">

            <input
                    type="email"
                    id="login-email"
                    placeholder="E-mail"
                    required>

            <input
                    type="password"
                    id="login-password"
                    placeholder="Пароль"
                    required>

            <button
                    class="btn btn-dark"
                    type="submit">

                Войти

            </button>

        </form>


        <p class="auth-bottom">

            Нет аккаунта?

            <a href="register.html">
                Зарегистрироваться
            </a>

        </p>

    </div>

</div>


<script src="js/auth.js"></script>

</body>
</html>
